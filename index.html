<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发现你的人格密码 · MBTI 人格测试</title>
  <meta name="description" content="MBTI 人格测试：快速测试 24 题约 5 分钟，深度测试 60 题精度更高。无需注册，含四维倾向、职业规划、关系社交与人生指导。">
  <meta name="theme-color" content="#3B2A86">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body id="page-home">
  <div class="noise" aria-hidden="true"></div>
  <main class="home-wrap">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>

    <div class="home-logo">✦ MBTI 人格实验室 ✦</div>

    <h1 class="home-title" id="homeTitle" aria-label="发现你的人格密码">
      <span id="typewriterText"></span><span class="caret" id="caret">|</span>
    </h1>

    <p class="home-sub">两种档位 · 无需注册 · 结果可保存与分享</p>

    <div class="home-chips">
      <div class="home-chip"><span class="hc-letters">E/I</span><small>外向 ⇄ 内向</small></div>
      <div class="home-chip"><span class="hc-letters">S/N</span><small>实感 ⇄ 直觉</small></div>
      <div class="home-chip"><span class="hc-letters">T/F</span><small>思考 ⇄ 情感</small></div>
      <div class="home-chip"><span class="hc-letters">J/P</span><small>判断 ⇄ 感知</small></div>
    </div>

    <!-- 档位选择 -->
    <div class="mode-cards" id="modeCards">
      <button type="button" class="mode-card" data-mode="quick" aria-pressed="false">
        <span class="mc-badge">快速</span>
        <b class="mc-title">快速测试</b>
        <span class="mc-meta">24 题 · 约 5 分钟</span>
        <span class="mc-desc">精选题目，快速拿到结果，适合分享给朋友</span>
      </button>
      <button type="button" class="mode-card active" data-mode="deep" aria-pressed="true">
        <span class="mc-badge rec">推荐</span>
        <b class="mc-title">深度测试</b>
        <span class="mc-meta">60 题 · 约 10-12 分钟</span>
        <span class="mc-desc">全覆盖题库，结果更精细，含一致性校验</span>
      </button>
    </div>

    <p class="start-meta" id="startMeta">60 题 · 约 10-12 分钟 · 60 题全覆盖 · 精度更高，含一致性校验</p>
    <a href="test.html" class="btn start-btn" id="startBtn">开始深度测试 →</a>
    <p class="resume-hint" id="resumeHint"></p>

    <p class="home-stats" id="homeCount">加载中…</p>
    <p class="home-note">MBTI 仅供参考，人格是流动的，别让标签定义你 😉</p>
  </main>

  <script src="data/questions.js"></script>
  <script src="data/profile.js"></script>
  <script src="script.js"></script>
</body>
</html>
