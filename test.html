<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>答题中 · MBTI 人格测试</title>
  <meta name="theme-color" content="#3B2A86">
  <meta name="description" content="MBTI 测试答题：快速档 24 题、深度档 64 题，实时雷达图与画像预览，支持键盘快捷键与断点续答。">
  <link rel="canonical" href="https://shay-ckm.github.io/-mbti-test/test.html">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="MBTI 人格实验室">
  <meta property="og:locale" content="zh_CN">
  <meta property="og:title" content="答题中 · MBTI 人格测试">
  <meta property="og:description" content="正在作答 MBTI 人格测试：24 题快速档或 64 题深度档。">
  <meta property="og:url" content="https://shay-ckm.github.io/-mbti-test/test.html">
  <meta property="og:image" content="https://shay-ckm.github.io/-mbti-test/assets/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://shay-ckm.github.io/-mbti-test/assets/og-image.png">
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/inter-var.woff2" crossorigin>
  <link rel="stylesheet" href="assets/fonts/fonts.css?v=5.0.0">
  <link rel="stylesheet" href="style.css?v=5.0.0">
</head>
<body id="page-test" class="theme-glass">
  <a class="skip-link" href="#main">跳到主内容</a>
  <div class="noise" aria-hidden="true"></div>
  <main class="test-wrap" id="main">
    <div class="blob tb1" aria-hidden="true"></div>
    <div class="blob tb2" aria-hidden="true"></div>

    <h1 class="visually-hidden">MBTI 人格测试答题</h1>

    <!-- 顶部：档位 / 重开 -->
    <div class="test-top">
      <a class="logo-mini" href="index.html">✦ 人格实验室</a>
      <span class="mode-badge" id="modeBadge">深度测试 · 64 题</span>
      <span class="spacer"></span>
      <span class="build-stamp" title="构建版本"></span>
      <a class="tt-reset" href="#" id="resetLink">↺ 重新开始</a>
    </div>

    <div class="progress-block">
      <div class="progress-track" id="progressTrack" role="progressbar" aria-valuemin="0" aria-valuemax="64" aria-valuenow="0" aria-label="答题进度"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-meta">
        <span>第 <b id="qCurrent">1</b> / <b id="qTotal">64</b> 题</span>
        <span>已完成 <b id="qDone">0</b> 题</span>
      </div>
    </div>

    <div class="test-grid">
      <!-- 实时雷达图 -->
      <aside class="radar-wrap">
        <div class="radar-txt">
          <h3>四维雷达图</h3>
          <canvas id="radar" width="230" height="230" aria-label="四维人格倾向雷达图"></canvas>
          <p class="radar-hint">每次作答都会实时变化 ✨</p>
        </div>
      </aside>

      <!-- 题目卡片 -->
      <section class="q-card">
        <span class="q-num" id="qNum">第 1 题</span>
        <p class="q-text" id="qText" aria-live="polite"></p>
        <div class="options" id="options" role="radiogroup" aria-label="请选择你的同意程度"></div>

        <div class="test-nav">
          <button type="button" class="btn btn-ghost" id="prevBtn">← 上一题</button>
          <button type="button" class="btn btn-primary" id="nextBtn">下一题 →</button>
        </div>

        <!-- 阶段提示（深度测试每 15 题一次） -->
        <div class="milestone" id="milestone" role="status"></div>
      </section>
    </div>

    <!-- 实时画像预览 -->
    <section class="live-panel" id="livePanel">
      <div class="live-head">
        <h3>✦ 实时画像预览 ✦</h3>
        <span class="live-bubble" id="liveBubble" aria-live="polite">嘘——没有标准答案，凭第一直觉选 ✨</span>
      </div>
      <div class="live-bars" id="liveBars"></div>
      <div class="live-foot">
        <div class="live-letters" id="liveLetters">? · ? · ? · ?</div>
        <div class="live-chips" id="liveChips"></div>
      </div>
    </section>

    <!-- 题号跳转 -->
    <section class="jump-panel">
      <div class="jump-head">
        <span>题号跳转</span>
        <span class="jump-hint">键盘 1-4 选答案 · ← → 切题</span>
      </div>
      <div class="jump-grid" id="jumpGrid"></div>
    </section>
  </main>

  <div class="toast" id="toast" role="status"></div>
  <script src="data/questions.js?v=5.0.0"></script>
  <script src="data/profile.js?v=5.0.0"></script>
  <script src="script.js?v=5.0.0" defer></script>
</body>
</html>
